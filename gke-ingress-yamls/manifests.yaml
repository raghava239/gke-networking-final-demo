apiVersion: v1
kind: Namespace
metadata:
  name: ingress-app1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-app1
  namespace: ingress-app1
  labels:
    app: ingress-app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-app1
  template:
    metadata:
      labels:
        app: ingress-app1
    spec:
      containers:
      - name: nginx
        image: us-central1-docker.pkg.dev/raghupothula/gke-networking-final-demo-ingress/ingress-app1:latest
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
          requests:
            cpu: "5m"
            memory: "16Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-app1-svc
  namespace: ingress-app1
  labels:
    app: ingress-app1
  annotations:
    # Enable container-native load balancing via NEGs
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: ingress-app1
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-app1
  namespace: ingress-app1
  annotations:
    # Trigger GKE classic external HTTP(S) Load Balancer (GLBC)
    kubernetes.io/ingress.class: "gce"
spec:
  # Map all fallback and root requests to our backend service
  defaultBackend:
    service:
      name: ingress-app1-svc
      port:
        number: 80
  rules:
  - http:
      paths:
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: ingress-app1-svc
            port:
              number: 80
